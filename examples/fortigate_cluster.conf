config system global
    set hostname "fw-edge-01"
    set timezone 26
    set admin-sport 8443
end

config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 198.51.100.2 255.255.255.248
        set allowaccess ping https ssh
        set type physical
        set description "WAN-OPERATEUR-PRIMARY-FIBRE"
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping https ssh snmp
        set type physical
        set description "LAN-INTERCO-SW-CORE-01"
    next
    edit "port3"
        set vdom "root"
        set mode static
        set ip 10.10.99.1 255.255.255.0
        set allowaccess ping https
        set type physical
        set description "DMZ-WEB-PUBLIQUE"
    next
    edit "ha-port1"
        set vdom "root"
        set type physical
        set description "HA-HEARTBEAT-LINK-1"
    next
    edit "ha-port2"
        set vdom "root"
        set type physical
        set description "HA-HEARTBEAT-LINK-2"
    next
end

config system ha
    set group-id 42
    set group-name "HA-CLUSTER-BMA"
    set mode a-p
    set hbdev "ha-port1" 50 "ha-port2" 50
    set session-pickup enable
    set ha-mgmt-status enable
    set override disable
    set priority 200
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 198.51.100.1
        set device "port1"
    next
    edit 2
        set dst 10.10.0.0 255.255.0.0
        set gateway 10.10.10.254
        set device "port2"
    next
end

config vpn ipsec phase1-interface
    edit "VPN-IPSEC-AZURE"
        set interface "port1"
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 14
        set remote-gw 20.19.100.45
        set psksecret <SECRET_MASQUÉ>
    next
end
