! ==============================================================================
! FICTIVE DEMONSTRATION CONFIGURATION - CISCO CATALYST 9500 CORE SWITCH
! IT Infrastructure Documentation Generator (InfraDoc) Test Example
! DO NOT APPLY ON PRODUCTION HARDWARE
! ==============================================================================
version 17.6
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname sw-core-01
!
boot-start-marker
boot-end-marker
!
vrf definition MGMT
 description Management Isolated VRF
 !
 address-family ipv4
 exit-address-family
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username admin privilege 15 secret 9 $9$dummyEncryptedSecretHashForDemoOnly!
username backup_audit privilege 5 secret 9 $9$dummyBackupUserAuditString!
!
ip domain name corp.bma-finance.loc
ip name-server 10.10.10.1 10.10.10.2
!
vtp mode transparent
!
vlan 10
 name VLAN-MGMT-ADMIN
!
vlan 20
 name VLAN-PRODUCTION-APPS
!
vlan 30
 name VLAN-DATABASE-ORACLE
!
vlan 40
 name VLAN-STORAGE-ISCSI
!
vlan 50
 name VLAN-BACKUP-VEEAM
!
vlan 99
 name VLAN-DMZ-EXTERNE
!
interface Port-channel1
 description LAG-TO-SW-CORE-02-INTER-CORE-TRUNK
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
!
interface TenGigabitEthernet1/0/1
 description UPLINK-TO-SW-CORE-02-L1
 channel-group 1 mode active
!
interface TenGigabitEthernet1/0/2
 description UPLINK-TO-SW-CORE-02-L2
 channel-group 1 mode active
!
interface TenGigabitEthernet1/0/3
 description FIREWALL-PRIMARY-FW-EDGE-01-PORT2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
!
interface GigabitEthernet1/0/10
 description SRV-HYP-01-NIC1-VM-TRAFFIC
 switchport mode trunk
 switchport trunk allowed vlan 20,30
!
interface GigabitEthernet1/0/11
 description SRV-DC-01-ACTIVE-DIRECTORY
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface Vlan10
 description SVI-MGMT-DEFAULT-GATEWAY
 ip address 10.10.10.254 255.255.255.0
 no shutdown
!
interface Vlan20
 description SVI-PROD-GATEWAY
 ip address 10.10.20.254 255.255.255.0
 no shutdown
!
interface Vlan30
 description SVI-DB-GATEWAY
 ip address 10.10.30.254 255.255.255.0
 no shutdown
!
ip routing
ip route 0.0.0.0 0.0.0.0 10.10.10.1
!
ntp server 10.10.10.10 prefer
ntp server 10.10.10.11
!
snmp-server community <SECRET_MASQUÉ> RO
snmp-server host 10.10.10.50 version 2c <SECRET_MASQUÉ>
!
line con 0
 exec-timeout 15 0
line vty 0 4
 transport input ssh
!
end
